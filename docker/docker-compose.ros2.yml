services:
  ros2-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfileros2.dockerfile
    image: family_robot_ros2:humble
    container_name: ros2-humble-dev
    privileged: true
    cap_add:
      - SYS_BOOT
      - SYS_ADMIN
    oom_score_adj: 1000
    stop_grace_period: 60s
    restart: unless-stopped
    stdin_open: true
    tty: true
    working_dir: /home/robot/MoxibustionRobotGroup/

    env_file:
      - ./envs/common.env
      - ./envs/local.env
      - ./envs/cloud.env

    environment:
      - TZ=Asia/Shanghai
      - DISPLAY=${DISPLAY}
      - GDK_SCALE=${GDK_SCALE:-1}
      - GDK_DPI_SCALE=${GDK_DPI_SCALE:-1}
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}

    volumes:
      - type: bind
        source: /home/robot/easefuture/
        target: /home/robot/
      - type: bind
        source: /var/log
        target: /var/log
      - type: bind
        source: /var/robot
        target: /var/robot
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
      - type: bind
        source: /var/run/dbus
        target: /var/run/dbus
      - type: bind
        source: ${HOME}/.ssh
        target: /home/dev/.ssh
        read_only: true
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/dev/.gitconfig
        read_only: true

    # 使用 host 网络模式时，容器直接使用主机网络
    # SSH 端口 22223 会直接绑定到 WSL 上
    # 从 Windows 连接 (日常开发用，建的文件权限与宿主机一致): ssh robot@localhost -p 22223 (密码: robot)
    # 从 Windows 连接 (root): ssh root@localhost -p 22223 (密码: robot)
    network_mode: host

    logging:
      driver: json-file
      options:
        max-size: "1000m"
        max-file: "3"
